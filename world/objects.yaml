# Global object legend (R4). One character = one meaning across ALL room files.
# footprint is [width, height] in tiles, anchored at the grid character's tile
# and extending right/down. Never draw furniture shape character-by-character
# in a room file — one anchor char here is the whole authoring cost.
#
# Optional `flip: x | y | both` mirrors the sprite (real art and the
# code-drawn placeholder alike) within its own footprint — e.g. a sofa
# authored facing right can be flipped to face left with `flip: x`, without
# touching footprint or needing a second art file. This applies to every
# placed instance of that character; there's no per-instance override.
#
# Optional `rotate: 90 | 180 | 270` turns the sprite about its own footprint's
# center, applied after flip. `footprint` always describes the object's real
# world-space size — for 90/270 it must be authored already-rotated: a sprite
# natively 4 wide x 2 tall, turned upright with `rotate: 90`, needs
# `footprint: [2, 4]`, not `[4, 2]` (which would stretch it, not rotate it).

F:
  name: fridge
  footprint: [1, 1]
  color: "#a9c9d6"
  need: hunger

T:
  name: toilet
  footprint: [1, 1]
  color: "#e9e6e0"
  need: washroom

